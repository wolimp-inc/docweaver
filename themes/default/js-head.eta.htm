<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tocbot@4.36/dist/tocbot.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12/styles/github-dark.min.css">

<link rel="stylesheet" href="<%= it.outputPath %>/css/inline-style.css">

<script src="https://cdn.jsdelivr.net/npm/tocbot@4.36/dist/tocbot.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/js/bootstrap.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12/languages/html.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12/languages/json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12/languages/bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.12/languages/javascript.min.js"></script>

<script src="<%= it.outputPath %>/js/toc-init.js?t=1"></script>

<script src="https://cdn.jsdelivr.net/npm/@aelluxjs/core@0.1.0-beta.4/dist/aellux.min.js"></script>
<script>
  AelluxJs.init({ mode: "full" });

  document.addEventListener("AelluxJsUpdate",
    (event) => {
      initOrRefreshToc();
      hljs.highlightAll();

      const ajaxAttr = AelluxJs.attr("ajax-href");
      const linksToUpdate = [
        `.article [href]:not([${ajaxAttr}])`,
        `nav [href]:not([${ajaxAttr}])`
      ];
      document.querySelectorAll(linksToUpdate.join(","))
      .forEach((link)=>{
        if(link.getAttribute("href")?.startsWith("#")) return;
        link.setAttribute(
          ajaxAttr,
          "#doc-content,#doc-navlinks,#doc-breadcrumb"
          );
      });
    }
  );

  document.addEventListener("AelluxJsAjaxStart",
    (e) => {
      const container = document.querySelector("#doc-content");
      container.style.transition = null;
      container.style.opacity = .2;
    }
  );

  document.addEventListener("AelluxJsAjaxLoaded",
    (e) => {
      const container = document.querySelector("#doc-content");
      container.style.transition = "opacity .25s linear";
      container.style.opacity = null;
      setNavActiveByUrl(window.location.href);
    }
  );

  document.addEventListener("click",
    (e) => {
      const link = e.target?.closest?.("a[href]");
      const any = e.target?.closest?.("[data-bs-toggle][data-bs-continue]");
      if (any && !link) return;
      const el = document.querySelector("[data-bs-toggle][data-bs-autohide=true][aria-expanded=true]");
      if (el) closeNavbar(el);
    }
  );

  function closeNavbar(bsToggler) {
    const targetSelector = bsToggler.getAttribute('data-bs-target') ||
      (bsToggler.getAttribute('aria-controls') ? `#${bsToggler.getAttribute('aria-controls')}` : null);
    const bsCollapse = targetSelector ? document.querySelector(targetSelector) : null;

    // 2. If open, remove the 'show' class to hide it
    if (bsCollapse?.classList.contains('show')) {
      bsCollapse.classList.remove('show');
      // 3. Update ARIA state to false
      bsToggler.setAttribute('aria-expanded', 'false');
    }
  }

  function comparableUrl(value) {
    const url = new URL(value, window.location.href);

    // Match by path + query, ignoring hash
    return `${url.origin}${url.pathname}${url.search}`;
  }

  function setNavActiveByUrl(url) {
    const target = comparableUrl(url);

    document.querySelectorAll(".nav-link[href]").forEach((link) => {
      const linkUrl = comparableUrl(link.href);
      const navItem = link.closest(".nav-item");

      navItem?.classList.toggle("active", linkUrl === target);
      if (linkUrl === target) openAllParentCollapses(navItem);
    });
  }

  function openAllParentCollapses(element) {
    let collapse = element.closest(".collapse:not(.show)");

    while (collapse) {
      if (collapse.id && collapse.getAttribute('data-bs-parent')) {
        const selector = `[data-bs-toggle][data-bs-target="#${collapse.id}"]`;
        const button = document.querySelector(selector);
        button.click();
      }

      collapse = collapse.parentElement?.closest(".collapse:not(.show)");
    }
  }

  document.addEventListener("DOMContentLoaded",
  function(){
    let currentRequest = null;

    const progressBar = document.querySelector("#page-progress");
    let progressTimer = null, progressTimer1 = null, progressTimer2 = null;

  document.addEventListener("AelluxJsAjaxStart",startProgress)
  document.addEventListener("AelluxJsAjaxComplete",finishProgress)

    function startProgress() {
      if (!progressBar) return;

      clearInterval(progressTimer);
      clearInterval(progressTimer1);
      clearInterval(progressTimer2);
      progressBar.style.transition = "none";
      progressBar.style.opacity = "1";
      progressBar.style.width = "10%";

      let progress = 10;
      progressTimer = setInterval(() => {
        progress += Math.random() * 12;
        if (progress > 85) progress = 85;
        progressBar.style.transition = null;
        progressBar.style.width = `${progress}%`;
      }, 200);
    }

    function finishProgress() {
      if (!progressBar) return;

      clearInterval(progressTimer);
      clearInterval(progressTimer1);
      clearInterval(progressTimer2);
      progressBar.style.width = "100%";
      progressTimer1 = setTimeout(() => progressBar.style.opacity = "0", 200);
      progressTimer2 = setTimeout(() => progressBar.style.width = "0%", 450);
    }
  });
</script>
